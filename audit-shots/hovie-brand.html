<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HOVIE 로고</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e5ebf1;color:#17212c;font-family:Arial,sans-serif}main{max-width:1200px;margin:auto;padding:48px}header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:32px}h1{font-size:20px;letter-spacing:.04em;margin:0}header p{font-size:14px;margin:0;color:#4b5c6f}.primary{height:320px;background:#101419;display:grid;place-items:center;border-radius:16px}.primary img{width:490px;max-width:80%}.variants{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;margin-top:20px}.light{height:230px;background:#f3f6f9;border-radius:16px;display:grid;place-items:center}.light img{width:330px;max-width:80%}.icons{display:flex;align-items:center;justify-content:center;gap:28px;border:1px solid #bdcad8;border-radius:16px}.app{width:112px;border-radius:25px}.small{width:48px;border-radius:11px}.tiny{width:24px}footer{display:flex;justify-content:space-between;margin-top:26px;font-size:13px;color:#4b5c6f}footer p{margin:0}@media(max-width:700px){main{padding:24px}.variants{grid-template-columns:1fr}header p{display:none}.primary{height:230px}.icons{height:180px}footer{gap:20px;line-height:1.6}}
</style>
<main>
<header><h1>HOVIE</h1><p>영화와 TV를 발견하고 기록하는 곳</p></header>
<div class="primary"><img src="/brand/hovie-dark.svg" alt="새 HOVIE 로고, 어두운 배경"></div>
<div class="variants"><div class="light"><img src="/brand/hovie.svg" alt="새 HOVIE 로고, 밝은 배경"></div><div class="icons"><img class="app" src="/icon-512.png" alt="앱 아이콘"><img class="small" src="/icon-192.png" alt="작은 앱 아이콘"><img class="tiny" src="/favicon.svg" alt="파비콘"></div></div>
<footer><p>두 프레임이 맞물린 H. 한 번의 선명한 컷.</p><p>벡터 워드마크 / 심볼 / 앱 아이콘</p></footer>
</main>
</html>
